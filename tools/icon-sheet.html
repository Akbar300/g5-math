<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Icon sheet (dev)</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/app.css">
<script src="../js/theme.js"></script>
<style>
  /* Dev-only page: every icon at lesson-chip size and tile size, in each unit color. Not linked from the site. */
  body{padding:16px;font-family:var(--font);color:var(--ink)}
  h1{font-family:var(--display);margin:0 0 4px}
  h2{font-family:var(--display);margin:20px 0 8px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
  .cell{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px}
  .row{display:flex;gap:8px;align-items:center}
  .t{width:56px;height:56px;padding:9px;border-radius:16px;background:var(--ic-soft);color:var(--ic)}
  .s{width:26px;height:26px;color:var(--ic)}
  .t svg,.s svg{width:100%;height:100%;display:block}
  .n{font-size:12px;font-weight:800;color:var(--muted);text-align:center}
</style>
</head>
<body>
<h1>Icon sheet</h1>
<p>Each icon at tile size and at chip size (26 px). Toggle the theme to check dark mode. <button class="icon-btn theme-toggle" data-theme-toggle></button></p>
<div id="out"></div>
<script src="../js/icons.js"></script>
<script>
  const G = window.G5I, colors = ['blue', 'violet', 'coral', 'gold', 'teal', 'rose', 'lime'];
  const used = {}; Object.entries(G.lesson).forEach(([id, k]) => (used[k] = used[k] || []).push(id));
  const sec = (title, set, note) => {
    let i = 0;
    return `<h2>${title}</h2><div class="grid">` + Object.entries(set).map(([k, svg]) => {
      const c = colors[i++ % colors.length];
      return `<div class="cell c-${c}"><div class="row"><span class="t">${svg}</span><span class="s">${svg}</span></div><span class="n">${k}${note && used[k] ? '<br>' + used[k].join(' ') : ''}</span></div>`;
    }).join('') + '</div>';
  };
  document.getElementById('out').innerHTML = sec('Units and arenas', G.unit) + sec('UI: tabs, card labels, buttons', G.ui) + sec('Concepts (lesson icons)', G.concept, true);
</script>
</body>
</html>
