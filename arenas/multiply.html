<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#040a1c">
<title>Multiply Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Pixelify+Sans:wght@600;700&family=Press+Start+2P&family=Rubik+Mono+One&family=Rubik:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#040a1c; --bg2:#071a3a;
  --cyan:#00e5ff; --blue:#4d9bff; --lime:#7CFF3A; --yellow:#ffe600; --orange:#ff9f1c;
  --text:#eaf6ff; --muted:#8fb3d9;
  --body:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
/* four display fonts (tap the Aa chip in the level menu to switch) */
body{--display:'Rubik Mono One','Arial Black',Impact,sans-serif;--dw:400;--ts:1;--ds:1;--us:1}
body[data-font="pixel"]{--display:'Pixelify Sans','Arial Black',Impact,sans-serif;--dw:700;--ts:1.2;--ds:1.04;--us:1.1}
body[data-font="arcade"]{--display:'Press Start 2P','Courier New',monospace;--dw:400;--ts:.62;--ds:.8;--us:.7}
body[data-font="tech"]{--display:'Audiowide','Arial Black',Impact,sans-serif;--dw:400;--ts:1.05;--ds:1.02;--us:1.02}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:var(--bg);touch-action:manipulation}
body{
  font-family:var(--body);font-weight:600;color:var(--text);min-height:100vh;min-height:100dvh;
  background:
    radial-gradient(700px 420px at 10% -8%,rgba(0,229,255,.26),transparent 62%),
    radial-gradient(700px 520px at 100% 105%,rgba(77,155,255,.28),transparent 62%),
    linear-gradient(var(--bg),var(--bg2));
  background-attachment:fixed;
  padding:max(10px,env(safe-area-inset-top)) 12px max(14px,env(safe-area-inset-bottom));
  overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(0,229,255,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.09) 1px,transparent 1px);
  background-size:34px 34px;mask-image:linear-gradient(transparent 5%,#000 90%);-webkit-mask-image:linear-gradient(transparent 5%,#000 90%)}
.app{position:relative;max-width:520px;margin:0 auto;z-index:1}

.cubes{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.cubes i{position:absolute;width:var(--s);height:var(--s);border:2px solid var(--c);box-shadow:0 0 14px var(--c),inset 0 0 10px var(--c);opacity:.3;animation:drift var(--t) ease-in-out infinite alternate}
@keyframes drift{from{transform:translateY(0) rotate(0)}to{transform:translateY(-26px) rotate(80deg)}}

/* ── compact header ── */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.logo{width:32px;height:40px;flex-shrink:0;filter:drop-shadow(0 0 6px rgba(0,229,255,.7));animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
h1{font-family:var(--display);font-weight:var(--dw);font-size:calc(min(3.9vw,1.05rem)*var(--ts));letter-spacing:.02em;line-height:1;white-space:nowrap;color:#fff;text-shadow:0 0 8px var(--cyan),0 0 22px rgba(0,229,255,.7)}
h1 em{font-style:normal;color:var(--lime);text-shadow:0 0 8px var(--lime),0 0 20px rgba(124,255,58,.7)}
.ctrls{display:flex;gap:7px;flex-shrink:0}
.chip{font-family:var(--display);font-weight:var(--dw);font-size:calc(.78rem*var(--us));letter-spacing:.03em;color:#04122b;background:var(--cyan);border:2px solid #000;box-shadow:3px 3px 0 #000;padding:0 11px;height:38px;min-width:42px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.chip:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.chip.dice{background:var(--yellow);font-size:1.05rem;padding:0}
.chip:focus-visible,.lv:focus-visible,.zone:focus-visible{outline:3px solid #fff;outline-offset:2px}

.xp{display:flex;align-items:center;gap:8px;margin:6px 0 8px}
.xpbar{flex:1;height:6px;background:rgba(0,229,255,.14);border-radius:9px;overflow:hidden}
.xpbar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--cyan),var(--lime));box-shadow:0 0 8px var(--cyan);transition:width .35s}
.xpt{font:700 .68rem var(--body);color:var(--muted);letter-spacing:.04em;white-space:nowrap}
.xpt b{color:var(--lime);font-weight:800}

.lvrow{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.lvrow::-webkit-scrollbar{display:none}
.lv{flex:0 0 auto;font-family:var(--display);font-weight:var(--dw);font-size:calc(.7rem*var(--us));color:var(--text);background:#0b1f45;border:2px solid #214a8f;padding:8px 10px;cursor:pointer;line-height:1.25;text-align:center}
.lv small{display:block;font:700 .62rem var(--body);color:var(--muted);margin-top:2px}
.lv[aria-pressed="true"]{border-color:var(--lime);color:var(--lime);box-shadow:0 0 12px rgba(124,255,58,.5);background:#0e2c3a}
.lv.fontbtn{border-color:var(--yellow);color:var(--yellow)}

/* ── arena ── */
.arena{position:relative;isolation:isolate;background:linear-gradient(180deg,#0a1d45,#06122e);border:3px solid var(--cyan);box-shadow:5px 5px 0 #000,0 0 26px rgba(0,229,255,.4);padding:8px 12px 12px;user-select:none;-webkit-user-select:none;overflow:hidden}
.arena::before,.arena::after{content:"";position:absolute;width:16px;height:16px;border:3px solid var(--lime);pointer-events:none;z-index:2}
.arena::before{left:-3px;top:-3px;border-right:0;border-bottom:0}
.arena::after{right:-3px;bottom:-3px;border-left:0;border-top:0}

/* ── ninja obby track: the ninja runs toward the flag as you finish steps ── */
.track{z-index:2;--nw:30px;--fin:66px;position:relative;height:64px}
.tcount{position:absolute;left:0;top:0;font-family:var(--display);font-weight:var(--dw);font-size:calc(.68rem*var(--us));color:var(--yellow)}
.floor{position:absolute;left:0;right:0;bottom:11px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--cyan),var(--blue) 60%,var(--lime));box-shadow:0 0 10px var(--cyan)}
.mark{position:absolute;bottom:8px;width:8px;height:8px;left:calc((100% - var(--fin) - var(--nw))*var(--p) + var(--nw)/2 - 4px);background:#10285a;border:1px solid #2a5aa8;transform:rotate(45deg);transition:background .2s}
.mark.on{background:var(--cyan);border-color:#fff;box-shadow:0 0 8px var(--cyan)}
.runner{position:absolute;bottom:14px;width:var(--nw);height:38px;z-index:3;
  left:calc((100% - var(--fin) - var(--nw))*var(--p,0));transition:left .5s cubic-bezier(.2,.9,.25,1);
  filter:drop-shadow(0 0 1.2px rgba(150,245,255,.95)) drop-shadow(0 0 calc(2px + 9px*var(--pw,0)) rgba(124,255,58,calc(.1 + .8*var(--pw,0))))}
.runner.noanim{transition:none}
.nj{display:block;width:100%;height:100%;transform-origin:50% 70%;animation:idle 1.6s ease-in-out infinite}
@keyframes idle{50%{transform:translateY(-2px)}}
/* afterimage trail while running at high power */
.runner.trail .nj{filter:drop-shadow(-9px 0 0 rgba(0,229,255,.55)) drop-shadow(-18px 0 0 rgba(0,229,255,.3)) drop-shadow(-27px 0 0 rgba(0,229,255,.14))}
.runner.trail.rev .nj{filter:drop-shadow(9px 0 0 rgba(0,229,255,.55)) drop-shadow(18px 0 0 rgba(0,229,255,.3))}
.nj.m-dash{animation:mDash .5s ease-out}
.nj.m-flip{animation:mFlip .62s ease-in-out}
.nj.m-jump{animation:mJump .55s ease-out}
.nj.m-spin{animation:mSpin .6s ease-in-out}
.nj.m-slash{animation:mSlash .55s ease-out}
.nj.m-star{animation:mStar .5s ease-out}
.nj.m-back{animation:mBack .45s ease-out}
.nj.m-win{animation:mWin .7s ease-in-out 3}
.nj.m-spawn{animation:mSpawn .4s ease-out}
@keyframes mDash{0%{transform:none}30%{transform:skewX(-24deg) scaleX(1.18)}100%{transform:none}}
@keyframes mFlip{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(-28px) rotate(-180deg)}100%{transform:translateY(0) rotate(-360deg)}}
@keyframes mJump{0%{transform:scale(1.15,.8)}35%{transform:translateY(-34px) scale(.9,1.12)}100%{transform:none}}
@keyframes mSpin{0%{transform:perspective(160px) rotateY(0) translateY(0)}50%{transform:perspective(160px) rotateY(540deg) translateY(-12px)}100%{transform:perspective(160px) rotateY(720deg) translateY(0)}}
@keyframes mSlash{0%{transform:none}35%{transform:rotate(-34deg) translateX(-4px)}60%{transform:rotate(26deg) translateX(10px) scale(1.12)}100%{transform:none}}
@keyframes mStar{0%{transform:none}30%{transform:rotate(-14deg) scaleX(.9)}60%{transform:rotate(12deg) translateX(6px)}100%{transform:none}}
@keyframes mBack{0%{transform:scaleX(-1)}50%{transform:scaleX(-1) translateY(-12px)}100%{transform:scaleX(-1)}}
@keyframes mWin{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-34px) rotate(-360deg)}}
@keyframes mSpawn{from{transform:scale(.2);opacity:0}to{transform:none;opacity:1}}

/* finish zone: flag + robot buddy */
.finish{position:absolute;right:0;bottom:11px;width:var(--fin);height:56px;pointer-events:none}
.flag{position:absolute;left:4px;bottom:0;width:18px;height:46px;transform-origin:20% 100%}
.flag .cloth{transform-origin:0 0;animation:wave 1.4s ease-in-out infinite}
@keyframes wave{50%{transform:skewY(8deg) scaleX(.85)}}
.volt{position:absolute;right:0;bottom:3px;width:30px;height:38px;filter:drop-shadow(0 0 6px rgba(0,229,255,.6));animation:idle 1.8s ease-in-out infinite}
.volt.hype{animation:hype .55s ease-in-out infinite}
.volt.cheer{animation:cheer .6s ease-in-out infinite}
.volt.hop{animation:hop .32s ease-out}
@keyframes hype{50%{transform:translateY(-8px)}}
@keyframes cheer{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-22px) rotate(10deg)}}
@keyframes hop{50%{transform:translateY(-12px)}}
.fx{position:absolute;inset:0;pointer-events:none;z-index:4}
.fx i{position:absolute;display:block}
.fx .star{width:13px;height:13px;margin-left:-6px;background:var(--cyan);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);filter:drop-shadow(0 0 4px var(--cyan));animation:starFly .62s ease-in forwards}
@keyframes starFly{from{transform:translateX(0) rotate(0);opacity:1}to{transform:translateX(96px) rotate(900deg);opacity:0}}
.fx .slash{width:38px;height:38px;margin:-19px 0 0 -19px;border:4px solid transparent;border-top-color:#fffbd0;border-right-color:var(--yellow);border-radius:50%;filter:drop-shadow(0 0 5px var(--yellow));animation:slashFx .36s ease-out forwards}
@keyframes slashFx{from{transform:rotate(-90deg) scale(.5);opacity:1}to{transform:rotate(60deg) scale(1.25);opacity:0}}
.fx .ln{height:2px;width:24px;background:linear-gradient(90deg,transparent,var(--cyan));animation:lnFx .4s ease-out forwards}
@keyframes lnFx{from{transform:translateX(0);opacity:1}to{transform:translateX(-26px);opacity:0}}
.fx .sp{width:5px;height:5px;background:var(--c,#7CFF3A);animation:spFx .6s ease-out forwards}
@keyframes spFx{from{transform:translate(0,0);opacity:1}to{transform:translate(var(--dx),var(--dy));opacity:0}}
.fx .ring{width:14px;height:14px;margin:-7px 0 0 -7px;border:2px solid var(--lime);border-radius:50%;animation:ringFx .55s ease-out forwards}
@keyframes ringFx{from{transform:scale(.4);opacity:1}to{transform:scale(4);opacity:0}}

/* work area: centered a touch to the left */
.stage{position:relative;z-index:1;display:flex;justify-content:center;align-items:flex-start;padding:10px 26px 4px 0;min-height:96px}

/* ── THE LONG DIVISION GRID: every digit owns a column ── */
.ld{display:grid;grid-auto-rows:1.4em;font-size:calc(var(--fs,2rem)*var(--ds,1));font-family:var(--display);font-weight:var(--dw);line-height:1;position:relative;width:max-content}
.ld .c{display:flex;align-items:center;justify-content:center;position:relative;z-index:1;color:#fff}
.ld .c::before{content:"";position:absolute;inset:.13em .03em;border-radius:.16em;z-index:-1}
.ld .divisor{justify-content:flex-end;padding-right:.5em;color:var(--blue);text-shadow:0 0 .4em rgba(77,155,255,.9)}
.ld .dividend{color:var(--cyan);text-shadow:0 0 .4em rgba(0,229,255,.85)}
.ld .quot{color:var(--lime);text-shadow:0 0 .4em rgba(124,255,58,.85)}
.ld .minus{color:var(--orange);text-shadow:0 0 .4em rgba(255,159,28,.9);font-size:.8em}
.ld .num.bd{color:var(--cyan)}
.ld .num.rem{color:var(--yellow);text-shadow:0 0 .45em rgba(255,230,0,.95)}
.ld .overline{grid-row:2;align-self:start;height:.085em;margin-left:.25em;background:var(--yellow);box-shadow:0 0 .4em rgba(255,230,0,.85);z-index:0}
.ld .bracket{grid-row:2;grid-column:2 / 4;justify-self:end;width:.45em;height:118%;align-self:start;overflow:visible;z-index:1;margin-top:-.02em;filter:drop-shadow(0 0 3px rgba(255,230,0,.9))}
.ld .rule{align-self:end;height:.085em;background:var(--yellow);box-shadow:0 0 .35em rgba(255,230,0,.85);z-index:4;border-radius:2px}
.ld .rule.on{background:#fffbd0;box-shadow:0 0 .6em #ffe600,0 0 1em rgba(255,230,0,.7)}
.ld .guide{justify-self:center;align-self:stretch;width:0;border-left:.06em dashed rgba(0,229,255,.7);z-index:0}
.ld .guide.up{border-left-color:rgba(124,255,58,.95);border-left-width:.08em}
.ld .hl-Q::before{background:rgba(124,255,58,.28)}
.ld .hl-M::before{background:rgba(255,230,0,.24)}
.ld .hl-S::before{background:rgba(255,159,28,.3)}
.ld .hl-B::before{background:rgba(0,229,255,.3)}
.ld .hl-G::before{border:.06em dashed rgba(124,255,58,.85);inset:.11em .02em}
.ld .c.hl-Q,.ld .c.hl-M,.ld .c.hl-S,.ld .c.hl-B{animation:dig .26s ease-out}
@keyframes dig{from{transform:scale(.55);opacity:0}to{transform:scale(1);opacity:1}}

/* guided question box (at the bottom) with the astro coach */
.dialog{position:relative;z-index:1;display:flex;gap:10px;align-items:flex-start;margin-top:6px;overflow:hidden;background:rgba(0,229,255,.08);border:2px solid rgba(0,229,255,.55);padding:7px 10px 8px}
.coach{width:40px;height:50px;flex-shrink:0;filter:drop-shadow(0 0 6px rgba(0,229,255,.6));animation:idle 2.2s ease-in-out infinite}
.coach.nod{animation:nod .35s ease-out}
@keyframes nod{40%{transform:scale(1.08,.9)}}
.say{min-width:0;flex:1}
.tagchip{display:inline-block;font-family:var(--display);font-weight:var(--dw);font-size:calc(.68rem*var(--us));letter-spacing:.04em;color:#04122b;padding:3px 8px;margin-bottom:3px}
.ask{font:700 .95rem/1.32 var(--body);color:#fff}
.ask b{color:var(--yellow);font-weight:800}
.recap{margin-top:4px;font:600 .72rem/1.3 var(--body);color:var(--muted)}
.recap b{color:var(--lime);font-weight:800}
.recap .tick{color:var(--lime);font-weight:800}

/* tap zones cover the whole arena */
.zone{position:absolute;top:0;bottom:0;border:0;background:transparent;z-index:10;cursor:pointer;display:flex;align-items:center;color:rgba(0,229,255,.6);font:700 2rem var(--body);touch-action:manipulation}
.zl{left:0;width:36%;justify-content:flex-start;padding-left:4px}
.zr{right:0;width:64%;justify-content:flex-end;padding-right:4px}
.zone:active{background:rgba(0,229,255,.07)}
.zone span{animation:nudge 1.1s ease-in-out infinite;text-shadow:0 0 10px var(--cyan)}
.zl span{animation-name:nudgeL}
@keyframes nudge{50%{transform:translateX(5px)}}
@keyframes nudgeL{50%{transform:translateX(-5px)}}
.arena.touched .zone span{opacity:.25;animation:none}
.zone[disabled] span{opacity:.08;animation:none}
.hintline{text-align:center;color:var(--muted);font:700 .72rem var(--body);margin-top:9px;letter-spacing:.03em}

.pop{position:absolute;left:84%;top:70px;width:9px;height:9px;pointer-events:none;z-index:20;animation:pop 1s ease-out forwards}
@keyframes pop{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}
.xpfloat{position:absolute;left:50%;top:44px;transform:translateX(-50%);font-family:var(--display);font-weight:var(--dw);font-size:calc(.95rem*var(--us));color:var(--lime);text-shadow:0 0 10px var(--lime);animation:flt 1.4s ease-out forwards;pointer-events:none;z-index:20;white-space:nowrap}
@keyframes flt{0%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,-26px);opacity:0}}

/* ── floating ninja stars (background) ── */
.stars{position:absolute;inset:0;z-index:0;pointer-events:none}
.st{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);opacity:.38}
.st i{display:block;width:100%;height:100%;background:var(--c);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);filter:drop-shadow(0 0 5px var(--c));animation:stDrift var(--t) ease-in-out infinite alternate,stSpin var(--r) linear infinite}
@keyframes stDrift{from{transform:translateY(0)}to{transform:translateY(-14px)}}
@keyframes stSpin{to{rotate:360deg}}
/* ── dramatic exit: big hero ninja ── */
.hero{position:absolute;left:0;top:0;width:30px;height:38px;z-index:15;pointer-events:none;will-change:transform;
  filter:drop-shadow(0 0 2px rgba(150,245,255,.95)) drop-shadow(0 0 14px rgba(124,255,58,.9))}
.hero svg{display:block;width:100%;height:100%}
.hx{position:absolute;pointer-events:none;z-index:14}
.hx.crescent{width:230px;height:230px;margin:-115px 0 0 -115px;border:12px solid transparent;border-top-color:#fffbd0;border-right-color:var(--yellow);border-radius:50%;filter:drop-shadow(0 0 14px var(--yellow))}
.hx.shock{width:40px;height:40px;margin:-20px 0 0 -20px;border:4px solid var(--cyan);border-radius:50%;box-shadow:0 0 22px var(--cyan),inset 0 0 18px var(--cyan)}
.hx.flash{inset:0;background:radial-gradient(circle at 50% 50%,#fff,rgba(0,229,255,.55) 40%,transparent 70%);z-index:13}
.hx.bolt{width:5px;height:150px;margin-left:-2px;background:linear-gradient(#fff,var(--cyan));box-shadow:0 0 14px var(--cyan);transform-origin:50% 0}
/* ── skins (unlocked by rank): ninja + robot buddy colours ── */
body[data-skin="lime"]{--nb:#1d4d12;--nb2:#2a6d1a;--nb3:#34861f;--nhi:#7CFF3A;--nsc:#7CFF3A;--nac:#e8ffd6;--vb:#1d5a22;--vm:#2a8a32;--vh:#3fb64a;--vac:#7CFF3A;--vey:#ffe600;--vft:#7CFF3A}
body[data-skin="ember"]{--nb:#6a2f0e;--nb2:#8a3f12;--nb3:#a24c16;--nhi:#e07a22;--nsc:#ffe600;--nac:#ffcf66;--vb:#6a2f0e;--vm:#b3581a;--vh:#e07a22;--vac:#ffcf66;--vey:#ffe600;--vft:#ff9f1c}
body[data-skin="frost"]{--nb:#8fb3d9;--nb2:#b7d2ee;--nb3:#a3c3e6;--nhi:#eaf6ff;--nsc:#00e5ff;--nac:#4d9bff;--vb:#5c86b8;--vm:#7fa6d4;--vh:#b7d2ee;--vac:#ffffff;--vey:#0b3a6e;--vft:#00e5ff}
body[data-skin="golden"]{--nb:#8a6a00;--nb2:#b58a00;--nb3:#c99a00;--nhi:#ffe066;--nsc:#ffffff;--nac:#fffbd0;--vb:#8a6a00;--vm:#b58a00;--vh:#ffe066;--vac:#fffbd0;--vey:#00e5ff;--vft:#ffffff}
body[data-skin="mythic"]{--nb:#0e5a63;--nb2:#14808a;--nb3:#1a97a3;--nhi:#5ff5ff;--nsc:#ffe600;--nac:#ffffff;--vb:#0e5a63;--vm:#14808a;--vh:#5ff5ff;--vac:#ffe600;--vey:#ffffff;--vft:#ffe600}
body[data-skin="mythic"] .runner{filter:drop-shadow(0 0 1.4px #fff) drop-shadow(0 0 10px rgba(255,230,0,.85)) drop-shadow(0 0 calc(2px + 9px*var(--pw,0)) rgba(124,255,58,calc(.1 + .8*var(--pw,0))))}

/* drawer: wrap so all the little switches fit */
.lvrow{flex-wrap:wrap;overflow:visible}
.lv.tgl{border-color:#2a5aa8}
.lv.tgl[aria-pressed="true"]{border-color:var(--lime);color:var(--lime)}
.lv.tgl[aria-pressed="false"]{opacity:.7}

/* daily quest chest chip */
.quest{font:800 .68rem var(--body);letter-spacing:.04em;color:var(--yellow);background:#0b1f45;border:2px solid #214a8f;padding:2px 7px;cursor:pointer;white-space:nowrap;line-height:1.3}
.quest b{color:#fff}
.quest.ready{border-color:var(--yellow);box-shadow:0 0 12px rgba(255,230,0,.8);animation:qpulse .8s ease-in-out infinite}
.quest.done{border-color:var(--lime);color:var(--lime)}
@keyframes qpulse{50%{transform:scale(1.12)}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translateX(-50%);z-index:60;background:#0b1f45;border:2px solid var(--cyan);color:#fff;font:700 .8rem var(--body);padding:8px 12px;box-shadow:3px 3px 0 #000;max-width:90vw;text-align:center;animation:toast 2.2s ease forwards;pointer-events:none}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}

/* combo + boss */
.combo{position:absolute;left:52px;top:-1px;font:800 .72rem var(--body);letter-spacing:.04em;color:#04122b;background:var(--cyan);padding:2px 7px;box-shadow:0 0 10px var(--cyan);animation:cpop .35s ease-out}
.combo.c3{background:var(--lime);box-shadow:0 0 12px var(--lime)}
.combo.c5{background:var(--yellow);box-shadow:0 0 14px var(--yellow)}
.combo.c8{background:var(--orange);box-shadow:0 0 16px var(--orange)}
@keyframes cpop{0%{transform:scale(1.7)}100%{transform:none}}
.hp{position:absolute;right:48px;top:2px;width:64px;height:9px;background:#2a1604;border:2px solid var(--orange);box-shadow:0 0 8px rgba(255,159,28,.7)}
.hp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--orange),var(--yellow));transition:width .4s}
.arena.boss{border-color:var(--orange);box-shadow:5px 5px 0 #000,0 0 30px rgba(255,159,28,.55)}
.arena.boss .tcount{color:var(--orange)}
.volt.boss{width:42px;height:52px;--vb:#6a2f0e;--vm:#c0661a;--vh:#ff9f1c;--vac:#ffe600;--vey:#ffffff;--vft:#ff9f1c;filter:drop-shadow(0 0 9px #ff9f1c)}
.volt.ko{animation:ko 1s ease-in forwards}
@keyframes ko{0%{transform:none}30%{transform:translate(8px,-20px) rotate(40deg)}100%{transform:translate(30px,-6px) rotate(130deg);opacity:.25}}
.banner{position:absolute;left:50%;top:72%;z-index:16;transform:translate(-50%,-50%);font-family:var(--display);font-weight:var(--dw);font-size:calc(1.15rem*var(--us));white-space:nowrap;color:var(--orange);text-shadow:0 0 12px var(--orange),0 3px 0 #000;pointer-events:none;animation:ban 1.5s ease-out forwards}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-50%) scale(2.4)}18%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-90%) scale(1.05)}}
.bigfloat{position:absolute;left:50%;top:52%;z-index:20;font-family:var(--display);font-weight:var(--dw);font-size:calc(2.2rem*var(--us));color:var(--yellow);text-shadow:0 0 16px var(--orange),0 4px 0 #000;pointer-events:none;animation:big 1.3s ease-out forwards;white-space:nowrap}
@keyframes big{0%{opacity:0;transform:translate(-50%,0) scale(.3) rotate(-10deg)}25%{opacity:1;transform:translate(-50%,-10px) scale(1.2) rotate(4deg)}100%{opacity:0;transform:translate(-50%,-40px) scale(1)}}

/* prediction buttons inside the guide box */
.dialog{pointer-events:none;z-index:12}
.pick{display:flex;gap:8px;margin-top:6px}
.pk{pointer-events:auto;flex:1;max-width:84px;height:36px;font-family:var(--display);font-weight:var(--dw);font-size:calc(1.05rem*var(--us));color:#04122b;background:var(--yellow);border:2px solid #000;box-shadow:3px 3px 0 #000;cursor:pointer;touch-action:manipulation}
.pk:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.pk.bad{background:#3a2a1a;color:#8a7a6a;box-shadow:none;animation:shk .35s}
.pk.good{background:var(--lime)}
@keyframes shk{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.pick[hidden]{display:none}
/* check-it digits snapping into place */
.sn{display:inline-block;animation:snap .38s cubic-bezier(.2,1.4,.4,1) backwards;animation-delay:calc(var(--i)*.07s + .25s)}
@keyframes snap{from{opacity:0;transform:translateY(-22px) scale(2)}to{opacity:1;transform:none}}
.sn.ok{color:var(--lime);font-size:1.15em}

/* full-screen cutscenes: rank-up & chest */
.cut{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;background:rgba(2,8,24,.9);border:0;width:100%;cursor:pointer;overflow:hidden}
.cut::before{content:"";position:absolute;width:160vmax;height:160vmax;left:50%;top:50%;margin:-80vmax 0 0 -80vmax;background:repeating-conic-gradient(from 0deg,rgba(0,229,255,.16) 0 8deg,transparent 8deg 22deg);animation:spinr 14s linear infinite}
@keyframes spinr{to{transform:rotate(360deg)}}
.cutin{position:relative;text-align:center;color:#fff;font-family:var(--body);padding:20px}
.cutbig{font-family:var(--display);font-weight:var(--dw);font-size:calc(2rem*var(--us));color:var(--yellow);text-shadow:0 0 20px var(--orange),0 4px 0 #000;animation:big2 .6s cubic-bezier(.2,1.5,.4,1) backwards}
@keyframes big2{from{transform:scale(.2) rotate(-12deg);opacity:0}}
.cutninja{width:120px;height:150px;margin:14px auto 4px;display:block;filter:drop-shadow(0 0 3px #fff) drop-shadow(0 0 22px var(--lime));animation:cspin 1s cubic-bezier(.2,1.2,.4,1) backwards}
@keyframes cspin{from{transform:scale(.2) rotate(-540deg);opacity:0}}
.cutrank{font-family:var(--display);font-weight:var(--dw);font-size:calc(1.3rem*var(--us));color:var(--lime);text-shadow:0 0 14px var(--lime)}
.cutskin{margin-top:8px;font:800 .95rem var(--body);color:var(--cyan)}
.cuttap{margin-top:16px;font:700 .75rem var(--body);color:var(--muted);animation:qpulse 1.2s ease-in-out infinite}
.chest{width:150px;height:130px;margin:10px auto}
.chest .lid{transform-origin:4px 12px;animation:lid .7s .35s cubic-bezier(.3,1.5,.5,1) forwards}
@keyframes lid{to{transform:rotate(-62deg) translate(-2px,-2px)}}
.chest .glow{opacity:0;animation:glow .5s .6s forwards}
@keyframes glow{to{opacity:1}}

/* hide-the-guide option: keep only the step label + answer buttons */
.dialog.noguide{background:none;border:0;padding:0;margin-top:4px}
.dialog.noguide .coach,.dialog.noguide .ask,.dialog.noguide .recap{display:none}
.dialog.noguide .pick{margin-top:2px}
/* ── multiplication work area ── */
.stage.mul{display:block;padding:6px 2px 2px;min-height:0}
.eq{font-family:var(--display);font-weight:var(--dw);text-align:center;color:#fff;text-shadow:0 0 .35em rgba(0,229,255,.8);line-height:1.15;margin-bottom:8px;white-space:nowrap}
.eq .eqa{color:var(--lime);text-shadow:0 0 .35em rgba(124,255,58,.9);visibility:hidden}
.eq .eqa.on{visibility:visible}
.eq .eqa.new{animation:dig .3s ease-out}
@keyframes dig{from{transform:scale(.55);opacity:0}to{transform:scale(1);opacity:1}}
.area{display:grid;gap:4px;margin:0 auto;max-width:360px;font-family:var(--display);font-weight:var(--dw)}
.area>div{display:flex;align-items:center;justify-content:center;min-width:0}
.corner{color:var(--muted);font-size:.7em}
.hd{color:var(--cyan);text-shadow:0 0 .4em rgba(0,229,255,.8);border-bottom:3px solid var(--cyan)}
.hd.one{grid-column:2 / -1}
.hd.new,.rl.new{animation:dig .3s ease-out}
.rl{color:var(--blue);text-shadow:0 0 .4em rgba(77,155,255,.8);border-right:3px solid var(--blue)}
.cl{border:2px solid;border-radius:6px;color:#fff}
.cl.t0{background:rgba(0,229,255,.12);border-color:rgba(0,229,255,.7)}
.cl.t1{background:rgba(255,230,0,.1);border-color:rgba(255,230,0,.65)}
.cl.t2{background:rgba(124,255,58,.1);border-color:rgba(124,255,58,.65)}
.cl.ghost{color:var(--muted);border-style:dashed;border-color:#2a5aa8;background:rgba(255,255,255,.03)}
.cl.new{animation:dig .3s ease-out;box-shadow:0 0 14px rgba(124,255,58,.9);background:rgba(124,255,58,.28)}
.cl.look,.ln.look,.sumline.look{outline:3px dashed rgba(124,255,58,.9);outline-offset:2px}
.sumline{margin:10px auto 0;text-align:center;font-family:var(--display);font-weight:var(--dw);color:var(--text);visibility:hidden;min-height:1.5em;white-space:nowrap}
.sumline.on{visibility:visible}
.sumline b{color:var(--lime)}
.sumline.new{animation:dig .3s ease-out}
.sumline.look:not(.on){visibility:visible;color:transparent}
.sumline.look:not(.on) b{color:transparent}
.lines{display:flex;flex-direction:column;gap:8px;max-width:360px;margin:6px auto 0}
.ln{font-family:var(--display);font-weight:var(--dw);color:#fff;visibility:hidden;padding:8px 10px;border-left:4px solid var(--cyan);background:rgba(0,229,255,.07);line-height:1.25}
.ln.on{visibility:visible}
.ln b{color:var(--yellow)}
.ln b.g{color:var(--lime)}
.ln small{font:600 .6em var(--body);color:var(--muted)}
.ln.new{animation:dig .3s ease-out;background:rgba(124,255,58,.18);border-left-color:var(--lime)}
.ln.look:not(.on){visibility:visible;color:transparent;border-left-color:#2a5aa8;background:rgba(255,255,255,.04)}
.ln.look:not(.on) b{color:transparent}
.stars3{letter-spacing:.1em;margin-right:6px;font-size:1.1em}
.sn.star{color:#3a4a6a}
.sn.star.on{color:var(--yellow);text-shadow:0 0 10px var(--yellow)}
.strat{background:transparent;border:1px solid var(--cyan);color:var(--cyan);margin-left:6px;font-size:calc(.58rem*var(--us))}
.tabar{position:relative;height:18px;margin:-2px 0 8px;background:rgba(255,159,28,.15);border:2px solid var(--orange)}
.tabar i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--yellow));transition:width .1s linear}
.tabar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:800 .64rem var(--body);color:#fff;text-shadow:0 1px 2px #000}
.pk{max-width:110px;font-size:calc(.95rem*var(--us))}

/* paper-style multiplication grid */
.paper{display:grid;justify-content:center;margin:2px auto 0;font-family:var(--display);font-weight:var(--dw);line-height:1}
.pc{display:flex;align-items:center;justify-content:center;color:#fff;position:relative;border-radius:.14em}
.pc.ad{color:var(--cyan);text-shadow:0 0 .4em rgba(0,229,255,.8)}
.pc.bd{color:var(--blue);text-shadow:0 0 .4em rgba(77,155,255,.8)}
.pc.sg{color:var(--orange);font-size:.8em}
.pc.zero{color:var(--orange);text-shadow:0 0 .4em rgba(255,159,28,.8)}
.pc.carry{color:var(--orange);font-size:.55em;align-items:flex-end}
.pc.ans,.pc.fin{color:var(--lime);text-shadow:0 0 .45em rgba(124,255,58,.9)}
.pc.new{animation:dig .3s ease-out;background:rgba(124,255,58,.28);box-shadow:0 0 .5em rgba(124,255,58,.8)}
.pc.look{outline:.07em dashed rgba(124,255,58,.9);outline-offset:-.05em;background:rgba(124,255,58,.1)}
.hr{grid-column:1 / -1;align-self:center;height:.09em;background:var(--yellow);box-shadow:0 0 .4em rgba(255,230,0,.85)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){

<script>
(function(){

};
var LV_KEYS=['facts','tricks','pro','elite','mix'];
var KIND={S:{l:'S',n:'SPLIT',c:'#00e5ff'},M:{l:'M',n:'MULTIPLY',c:'#ffe600'},A:{l:'+',n:'ADD',c:'#7CFF3A'},U:{l:'−',n:'SUBTRACT',c:'#ff9f1c'},T:{l:'T',n:'THINK',c:'#4d9bff'}};
var STRAT={sq5:'5-SQUARE TRICK',paper:'PAPER MATH',split:'SPLIT',fix:'ROUND & FIX',half:'DOUBLE-HALVE',ten:'TEN TRICK',five:'×5 TRICK',nine:'×9 TRICK',eleven:'×11 TRICK',fact:'FACT'};
var STRAT_LV=[3,8,15];

function ri(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pickOne(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}

/* break a number into easy pieces: 47 → 40+7, 407 → 400+7, 8 → 5+3 */
function placeSplit(x){
 if(x>=10){var s=String(x),p=[],i;for(i=0;i<s.length;i++){var d=+s[i];if(d)p.push(d*Math.pow(10,s.length-1-i));}return p;}
 return x>=6?[5,x-5]:[x];
}
function mulRecap(p,q){
 var pr=p*q,zp=zc(p),zq=zc(q),z=zp+zq;
 if(!z)return p+' × '+q+' = <b>'+pr+'</b>';
 var bp=p/Math.pow(10,zp),bq=q/Math.pow(10,zq);
 return bp+' × '+bq+' = '+(bp*bq)+', then put '+z+' zero'+(z>1?'s':'')+' back → <b>'+pr+'</b>';
}
function mulAsk(p,q){
 var z=zc(p)+zc(q),t='What is <b>'+p+' × '+q+'</b>?';
 if(z){var bp=p/Math.pow(10,zc(p)),bq=q/Math.pow(10,zc(q));t+='<br>Trick: do <b>'+bp+' × '+bq+'</b> first, then add the zero'+(z>1?'s':'')+'.';}
 return t;
}
function step(k,ask,recap,reveal,look,pk){return {k:k,ask:ask,recap:'<span class="tick">✓</span> '+recap,reveal:reveal||[],look:look||[],pk:pk==null?null:pk};}

/* ── strategy builders: every problem is a short list of mental-math steps ── */
function buildSplit(a,b,strat,keepB){
 var pa=placeSplit(a),pb=(b>=10&&!keepB)?placeSplit(b):[b],ans=a*b,st=[],r,c,vals=[];
 st.push(step('S','How can we break <b>'+a+'</b> into easy pieces?'+(pb.length>1?' Do the same with <b>'+b+'</b>.':''),
  '<b>'+a+'</b> = '+pa.join(' + ')+(pb.length>1?' and <b>'+b+'</b> = '+pb.join(' + '):'')+'. Now every piece is easy!',['split'],[]));
 for(r=0;r<pb.length;r++)for(c=0;c<pa.length;c++){
  var v=pb[r]*pa[c];vals.push(v);
  st.push(step('M',mulAsk(pb[r],pa[c]),mulRecap(pb[r],pa[c]),['c'+r+'_'+c],['c'+r+'_'+c],v));
 }
 st.push(step('A','Add all the pieces: <b>'+vals.join(' + ')+'</b> = ?','<b>'+vals.join(' + ')+' = '+ans+'</b>. So '+a+' × '+b+' = '+ans+'!',['sum','ans'],['sum'],ans));
 return {a:a,b:b,ans:ans,strat:strat||'split',steps:st,board:{type:'area',pa:pa,pb:pb,vals:vals}};
}
function buildFix(a,b){
 var base=a>=100?100:10,r=Math.round(a/base)*base,diff=r-a,ad=Math.abs(diff),X=r*b,Y=ad*b,ans=a*b,over=diff>0,st=[];
 st.push(step('T','Is <b>'+a+'</b> close to an easy number? Which one?','<b>'+a+'</b> is just '+ad+' '+(over?'less':'more')+' than <b>'+r+'</b>. Use '+r+' and fix it after!',['L0'],[]));
 st.push(step('M',mulAsk(r,b),mulRecap(r,b),['L1'],['L1'],X));
 st.push(step('M','We used '+r+' instead of '+a+'. How much '+(over?'extra':'missing')+' is that?<br><b>'+ad+' × '+b+'</b> = ?',ad+' × '+b+' = <b>'+Y+'</b>. That is the '+(over?'extra':'missing')+' part.',['L2'],['L2'],Y));
 st.push(step(over?'U':'A',over?'Take the extra away: <b>'+X+' − '+Y+'</b> = ?':'Add the missing part: <b>'+X+' + '+Y+'</b> = ?',X+(over?' − ':' + ')+Y+' = <b>'+ans+'</b>.',['L3','ans'],['L3'],ans));
 return {a:a,b:b,ans:ans,strat:'fix',steps:st,board:{type:'lines',lines:[
  '<b>'+a+'</b> ≈ <b>'+r+'</b> ('+a+' = '+r+(over?' − ':' + ')+ad+')',
  r+' × '+b+' = <b>'+X+'</b>',
  ad+' × '+b+' = <b>'+Y+'</b> '+(over?'extra':'missing'),
  X+(over?' − ':' + ')+Y+' = <b class="g">'+ans+'</b>']}};
}
function buildHalf(a,b){
 var ans=a*b,seq=[],x=a,y=b,st=[],lines=[],i;
 while(!(y%10===0&&x<10)&&x%2===0&&seq.length<4){x/=2;y*=2;seq.push([x,y]);}
 for(i=0;i<seq.length;i++){
  var px=i?seq[i-1][0]:a,py=i?seq[i-1][1]:b;
  lines.push(seq[i][0]+' × '+seq[i][1]+'  <small>(half, double)</small>');
  st.push(step('T','Halve <b>'+px+'</b> and double <b>'+py+'</b>. What two numbers do you get?',px+' ÷ 2 = '+seq[i][0]+' and '+py+' × 2 = '+seq[i][1]+'. The answer stays the same!',['L'+i],[]));
 }
 lines.push(x+' × '+y+' = <b class="g">'+ans+'</b>');
 st.push(step('M',mulAsk(x,y),mulRecap(x,y),['L'+seq.length,'ans'],['L'+seq.length],ans));
 return {a:a,b:b,ans:ans,strat:'half',steps:st,board:{type:'lines',lines:lines}};
}
function buildTen(a,b){
 var ans=a*b,st=[];
 if(b===10||b===100){
  var z=b===10?'one zero':'two zeros';
  st.push(step('T','What happens to the digits when you multiply by <b>'+b+'</b>?','Multiplying by '+b+' slides every digit over and puts '+z+' on the end.',['L0'],[]));
  st.push(step('M','So <b>'+a+' × '+b+'</b> = ?',a+' × '+b+' = <b>'+ans+'</b>.',['L1','ans'],['L1'],ans));
  return {a:a,b:b,ans:ans,strat:'ten',steps:st,board:{type:'lines',lines:['× '+b+' → add '+z,a+' × '+b+' = <b class="g">'+ans+'</b>']}};
 }
 var t=b/10,X=a*t;
 st.push(step('T','Cover the zero in <b>'+b+'</b>. What easy multiplication is left?','Ignore the zero: just do <b>'+a+' × '+t+'</b>.',['L0'],[]));
 st.push(step('M','<b>'+a+' × '+t+'</b> = ?',mulRecap(a,t),['L1'],['L1'],X));

function buildFive(a){
 var X=a*10,ans=a*5,st=[];

 return {a:a,b:5,ans:ans,strat:'five',steps:st,board:{type:'lines',lines:['5 is half of 10','× 10: '+a+' × 10 = <b>'+X+'</b>','half of '+X+' = <b class="g">'+ans+'</b>']}};
}
function buildNine(a){
 var X=a*10,ans=a*9,st=[];
 st.push(step('T','<b>9</b> is just one less than 10. How could that help?','9 = 10 − 1, so <b>'+a+' × 9 = '+a+' × 10 − '+a+'</b>.',['L0'],[]));

 var st=[step('M','What is <b>'+a+' × '+b+'</b>?',a+' × '+b+' = <b>'+ans+'</b>. Count by '+a+'s: '+cnt.join(', ')+'.',['L0','ans'],['L0'],ans),
  step('T','Flip it! Does <b>'+b+' × '+a+'</b> give the same answer?',b+' × '+a+' = <b>'+ans+'</b> too. Flipping makes some facts easier!',['L1'],[])];
 return {a:a,b:b,ans:ans,strat:'fact',steps:st,board:{type:'lines',lines:['count by '+a+'s: '+cnt.join(', '),'flip it: '+b+' × '+a+' = <b class="g">'+ans+'</b>']}};
}


/* ── paper-style column multiplication: line up, multiply each digit, shift, add ── */
var PLACE=['ones','tens','hundreds','thousands'];
function buildPaper(a,b){
 var A=String(a).split('').reverse().map(Number),B=String(b).split('').reverse().map(Number),la=A.length,lb=B.length,ans=a*b,W=String(ans).length;
 var cells=[],st=[],j,i,k;
 st.push(step('T','Line the numbers up on the right. Which digit of <b>'+b+'</b> do we start with?','Start with the <b>'+PLACE[0]+'</b> digit, <b>'+B[0]+'</b>. Multiply it by every digit of <b>'+a+'</b>, from right to left.',[],['b0']));
 st[0].row=0;
 for(j=0;j<lb;j++){
  var carry=0;
  if(j>0){
   var zi=[];for(k=0;k<j;k++){cells.push({id:'z'+j+'_'+k,r:'p'+j,pos:k,t:'0',cls:'zero'});zi.push('z'+j+'_'+k);}
   var s0=step('T','Next digit of <b>'+b+'</b> is <b>'+B[j]+'</b>, in the <b>'+PLACE[j]+'</b> place. First slide over: how many zeros go at the end of the new row?','Write <b>'+j+' zero'+(j>1?'s':'')+'</b> first. Each digit in this row is worth '+Math.pow(10,j)+' times more!',zi,['b'+j]);
   s0.row=j;st.push(s0);
  }
  for(i=0;i<la;i++){
   var val=B[j]*A[i]+carry,d=val%10,c=Math.floor(val/10),ids=[],last=i===la-1;
   if(last){
    var vs=String(val).split('').reverse();
    vs.forEach(function(ch,q){var id='p'+j+'_'+i+'_'+q;cells.push({id:id,r:'p'+j,pos:i+j+q,t:ch,cls:''});ids.push(id);});
   }else{
    cells.push({id:'p'+j+'_'+i,r:'p'+j,pos:i+j,t:String(d),cls:''});ids.push('p'+j+'_'+i);
    if(c>0){cells.push({id:'k'+j+'_'+i,r:'k'+j,pos:i+1,t:String(c),cls:'carry'});ids.push('k'+j+'_'+i);}
   }
   var look=['a'+i,'b'+j];if(i>0&&carry>0)look.push('k'+j+'_'+(i-1));
   var ask='What is <b>'+B[j]+' × '+A[i]+'</b>'+(i>0&&carry>0?', plus the carried <b>'+carry+'</b>':'')+'?';
   var rc=last?(val+' → write all of it.'):(c>0?val+' → write the <b>'+d+'</b>, carry the <b>'+c+'</b>.':val+' → write <b>'+d+'</b>.');
   if(lb===1&&last)ids.push('ans');
   var s1=step('M',ask,rc,ids,look,val);s1.row=j;st.push(s1);
   carry=c;
  }
 }
 if(lb>=2){
  var ai=[];String(ans).split('').reverse().forEach(function(ch,q){var id='n'+q;cells.push({id:id,r:'ans',pos:q,t:ch,cls:'ans'});ai.push(id);});
  ai.push('ans');
  var parts=[],jj;for(jj=0;jj<lb;jj++)parts.push(a*B[jj]*Math.pow(10,jj));
  var sa=step('A','Add the lines: <b>'+parts.join(' + ')+'</b> = ?','<b>'+parts.join(' + ')+' = '+ans+'</b>. So '+a+' × '+b+' = '+ans+'!',ai,['rows'],ans);
  sa.row=lb-1;st.push(sa);
 }
 return {a:a,b:b,ans:ans,strat:'paper',steps:st,board:{type:'paper',A:A,B:B,la:la,lb:lb,W:W,cells:cells}};
}
function splitProblem(a,b){var m=save.method==='mix'?(Math.random()<.5?'box':'paper'):save.method;return m==='box'?buildSplit(a,b,'split'):buildPaper(a,b);}


function buildSquare5(n){
 var t=Math.floor(n/10),u=t+1,m=t*u,ans=n*n,st=[];
 st.push(step('T','Numbers that end in <b>5</b> have a secret when you square them! Look at the tens digit of <b>'+n+'</b>. What is it, and what is one more than it?','The tens digit is <b>'+t+'</b>, and one more is <b>'+u+'</b>.',['L0'],[]));
 st.push(step('M','Multiply them: <b>'+t+' × '+u+'</b> = ?',t+' × '+u+' = <b>'+m+'</b>. That is the front of the answer.',['L1'],['L1'],m));
 st.push(step('M','The end is always <b>25</b>. Put <b>25</b> after <b>'+m+'</b>. What number do you get?',m+' and 25 side by side → <b>'+ans+'</b>. So '+n+' × '+n+' = '+ans+'!',['L2','ans'],['L2'],ans));
 return {a:n,b:n,ans:ans,strat:'sq5',steps:st,board:{type:'lines',lines:[n+': tens digit <b>'+t+'</b>, one more is <b>'+u+'</b>',t+' × '+u+' = <b>'+m+'</b>',m+' | 25 → <b class="g">'+ans+'</b>']}};
}

/* ── problem generator by level ── */
function makeProblem(level){
 var a,b,t;
 if(level==='facts'){
  if(Math.random()<0.7){
   a=pickOne([6,7,8,9,11,12]);b=ri(6,12);
   return buildSplit(a,b,'split',true);
  }
  return buildFactEasy(ri(2,5),ri(2,12));
 }
 if(level==='tricks'){
  t=Math.random();
  if(t<.14)return buildTen(ri(12,99),pickOne([10,100]));
  if(t<.28)return buildTen(ri(3,19),pickOne([20,30,40,50,60,70,80,90]));
  if(t<.42)return buildFive(2*ri(6,49));
  if(t<.56)return buildNine(ri(12,99));
  if(t<.78)return buildEleven(ri(12,98));
  return buildSquare5(10*ri(1,9)+5);
 }
 if(level==='pro'){
  do{a=ri(12,99);}while(a%10===0);b=ri(3,9);
  if((a%10>=8||a%10<=1)&&Math.random()<.75)return buildFix(a,b);
  return splitProblem(a,b);
 }
 if(level==='elite'){
  if(Math.random()<.1)return buildSquare5(10*ri(1,9)+5);
  if(Math.random()<.2){
   var ok=0;do{a=2*ri(6,24);b=pickOne([15,25,35,45]);var x=a,y=b,n=0;while(!(y%10===0&&x<10)&&x%2===0&&n<4){x/=2;y*=2;n++;}ok=(y%10===0&&x<=20);}while(!ok);
   return buildHalf(a,b);
  }
  do{a=ri(12,99);b=ri(11,29);}while(a%10===0||b%10===0);
  return splitProblem(a,b);
 }
 if(Math.random()<.08)return buildSquare5(10*ri(1,9)+5);
 t=Math.random();
 if(t<.4){do{a=ri(101,999);}while(a%100===0);return splitProblem(a,ri(3,9));}
 if(t<.62){do{a=ri(12,99);b=ri(11,39);}while(a%10===0||b%10===0);return splitProblem(a,b);}
 if(t<.78){return buildFix(pickOne([98,99,198,199,297,298,299,398,399,497,498,499,598,599]),ri(3,9));}
 if(t<.9){return buildFix(99,ri(12,60));}
 a=2*ri(6,24);b=pickOne([15,25,35,45,55]);
 return buildHalf(a,b);
}

/* answer choices for the prediction round: near misses, never silly */
function nearMiss(x){
 var c=x>=40?[x+10,x-10,x+1,x-1,x+100,x-100,x+20,x-20]:x>=12?[x+10,x-10,x+2,x-2,x+1,x-1,x+5,x-5]:[x+1,x-1,x+2,x-2,x+3,x-3];
 c=shuffle(c.filter(function(v){return v>0&&v!==x;}));
 var o=[x],i;for(i=0;i<c.length&&o.length<3;i++)if(o.indexOf(c[i])<0)o.push(c[i]);
 return shuffle(o);
}

/* ── drawing the work area ── */
function render(P,k,fs,sw,ah){
 var rev={},nw={},lk={},eq,H='',B=P.board;
 P.steps.slice(0,k).forEach(function(s){s.reveal.forEach(function(id){rev[id]=1;});});
 if(k>0)P.steps[k-1].reveal.forEach(function(id){nw[id]=1;});
 if(k<P.steps.length)P.steps[k].look.forEach(function(id){lk[id]=1;});
 H+='<div class="eq" style="font-size:'+(fs*1.45).toFixed(1)+'px">'+P.a+' × '+P.b+'<span class="eqa'+(rev.ans?' on':'')+(nw.ans?' new':'')+'"> = '+P.ans+'</span></div>';
 if(B.type==='paper'){
  var W=B.W,rowsEm=3.82+1.3*B.lb+(B.lb>=2?1.62:0),eqH=fs*1.45*1.15+10,pf=Math.max(14,Math.min(fs*1.5,((sw||320)-10)/(1.2*W+1.1),((ah||999)-eqH)/rowsEm)),rowNow=0;
  P.steps.slice(0,k).forEach(function(s){if(s.row!=null)rowNow=s.row;});
  var tr='.9em 1.3em 1.3em .32em repeat('+B.lb+',1.3em)'+(B.lb>=2?' .32em 1.3em':'');
  var gc=function(pos){return W+1-pos;};
  H+='<div class="paper" style="font-size:'+pf.toFixed(1)+'px;grid-template-columns:.9em repeat('+W+',1.2em);grid-template-rows:'+tr+'">';
  B.A.forEach(function(d,i){H+='<div class="pc ad'+(lk['a'+i]?' look':'')+'" style="grid-row:2;grid-column:'+gc(i)+'">'+d+'</div>';});
  B.B.forEach(function(d,j){H+='<div class="pc bd'+(lk['b'+j]?' look':'')+'" style="grid-row:3;grid-column:'+gc(j)+'">'+d+'</div>';});
  H+='<div class="pc sg" style="grid-row:3;grid-column:1">×</div><div class="hr" style="grid-row:4"></div>';
  if(B.lb>=2){H+='<div class="pc sg" style="grid-row:'+(4+B.lb)+';grid-column:1">+</div><div class="hr" style="grid-row:'+(5+B.lb)+'"></div>';}
  B.cells.forEach(function(c){
   if(!rev[c.id])return;
   var row,isCarry=c.r.charAt(0)==='k';
   if(isCarry){if(+c.r.slice(1)!==rowNow)return;row=1;}
   else if(c.r==='ans')row=6+B.lb;
   else row=5+(+c.r.slice(1));
   var lkr=lk.rows&&c.r.charAt(0)==='p';
   H+='<div class="pc '+c.cls+(nw[c.id]?' new':'')+((lk[c.id]||lkr)?' look':'')+(B.lb===1&&c.r==='p0'?' fin':'')+'" style="grid-row:'+row+';grid-column:'+gc(c.pos)+'">'+c.t+'</div>';
  });

 var a=au();if(!a)return;var t=a.currentTime+(t0||0),o=a.createOscillator(),g=a.createGain();
 o.type=type||'square';o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
 g.gain.setValueAtTime(vol||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);

}

 var a=au();if(!a)return;var t=a.currentTime+(t0||0),n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),ch=b.getChannelData(0);

 var s=a.createBufferSource();s.buffer=b;var fl=a.createBiquadFilter();fl.type='bandpass';fl.Q.value=1.2;
 fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(f1,t+d);
 var g=a.createGain();g.gain.setValueAtTime(vol||.12,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
 s.connect(fl);fl.connect(g);g.connect(a.destination);s.start(t);s.stop(t+d+.02);

 if(save.q.n<QUEST_GOAL){toast('Daily quest: clear '+QUEST_GOAL+' problems · '+save.q.n+'/'+QUEST_GOAL+' so far');return;}
 save.q.c=true;persist();S.chest();
 var rk=grantXP(QUEST_XP);
 openCut('<div class="cutin"><div class="cutbig">DAILY CHEST!</div>'+CHEST+'<div class="cutrank">+'+QUEST_XP+' XP</div><div class="cuttap">tap to continue</div></div>');
 if(rk>-1)setTimeout(function(){rankCut(rk);},3900);
}
/* ── background ninja stars ── */
var starEls=[];
(function(){
 var cs=['#00e5ff','#7CFF3A','#ffe600','#4d9bff'],h='';
 for(var i=0;i<10;i++){
  var side=i%2,x=side?(93+Math.random()*4):(1+Math.random()*4),y=7+(i>>1)*18+Math.random()*7;
  h+='<div class="st" style="--x:'+x.toFixed(1)+'%;--y:'+y.toFixed(1)+'%;--s:'+(10+Math.random()*7).toFixed(0)+'px;--c:'+cs[i%4]+'"><i style="--t:'+(2.2+Math.random()*2.2).toFixed(1)+'s;--r:'+(5+Math.random()*7).toFixed(1)+'s"></i></div>';
 }
 $('stars').innerHTML=h;starEls=[].slice.call($('stars').children);
})();
/* volley: every star launches in one staggered wave, then fades back into place */
function starVolley(){
 if(reduce)return;
 var W=$('arena').clientWidth;
 starEls.slice().sort(function(a,b){return a.offsetLeft-b.offsetLeft;}).forEach(function(e,i){
  var dx=W+60-e.offsetLeft;
  e.animate([{transform:'translate(0,0)',opacity:.38},{transform:'translate('+(-14)+'px,0)',opacity:.9,offset:.12},{transform:'translate('+dx+'px,'+(-30+i%3*30)+'px)',opacity:.9,offset:.8},{transform:'translate('+dx+'px,0)',opacity:0}],
   {duration:900,delay:i*55,easing:'cubic-bezier(.5,0,.8,.5)',fill:'backwards'});
  e.animate([{opacity:0},{opacity:.38}],{duration:500,delay:i*55+900,fill:'backwards'});
 });
}
/* burst: stars blast outward from the centre when the ninja strikes */
function starBurst(cx,cy){
 starEls.forEach(function(e,i){
  var vx=e.offsetLeft-cx,vy=e.offsetTop-cy,m=Math.hypot(vx,vy)||1,k=150;
  e.animate([{transform:'translate(0,0) scale(1)',opacity:.38},{transform:'translate('+vx/m*k+'px,'+vy/m*k+'px) scale(1.8)',opacity:.95,offset:.35},{transform:'translate(0,0) scale(1)',opacity:.38}],{duration:1000,easing:'ease-out'});
 });
}

/* ── dramatic exit: ninja grows, leaps to the centre, strikes, and teleports home ── */
var busy=false;
function ex(cls,x,y,w,h){var e=document.createElement('i');e.className='hx '+cls;if(x!=null){e.style.left=x+'px';e.style.top=y+'px';}$('arena').appendChild(e);return e;}
function transitionNext(){
 if(reduce||save.ta){if(save.ta)S.whoosh();newProblem();return;}
 busy=true;S.tele();S.whoosh();
 var ar=$('arena'),ab=ar.getBoundingClientRect(),run=$('runner'),rb=run.getBoundingClientRect(),sb=$('stage').getBoundingClientRect();
 var sx=rb.left-ab.left,sy=rb.top-ab.top;
 var cx=ab.width/2-15-12,cy=(sb.top-ab.top)+sb.height*0.45-19;
 var hero=document.createElement('div');hero.className='hero';hero.innerHTML='<svg viewBox="0 0 32 40" shape-rendering="crispEdges"><use href="#spr-ninja"/></svg>';
 ar.appendChild(hero);
 hero.style.transform='translate('+sx+'px,'+sy+'px)';
 run.style.visibility='hidden';
 fx('ring',runnerX(1)+15,24);sparks(runnerX(1)+15,26,10);
 var T=function(x,y,sc,rot){return 'translate('+x+'px,'+y+'px) scale('+sc+') rotate('+rot+'deg)';};
 /* 1. giant leap into the centre */
 var leap=hero.animate([
  {transform:T(sx,sy,1,0)},
  {transform:T(sx+(cx-sx)*.45,Math.min(sy,cy)-90,2.2,-200),offset:.5},
  {transform:T(cx,cy,3.6,-360)}
 ],{duration:620,easing:'cubic-bezier(.3,.1,.3,1)',fill:'forwards'});
 leap.onfinish=function(){
  var mx=cx+15,my=cy+19;
  /* 2. impact: shockwave, flash, slash, stars blast */
  var fl=ex('flash');fl.animate([{opacity:0},{opacity:.9,offset:.25},{opacity:0}],{duration:420,fill:'forwards'});
  var sh=ex('shock',mx,my);sh.animate([{transform:'scale(.4)',opacity:1},{transform:'scale(13)',opacity:0}],{duration:620,easing:'ease-out',fill:'forwards'});
  var cr=ex('crescent',mx,my);cr.animate([{transform:'rotate(-120deg) scale(.4)',opacity:1},{transform:'rotate(80deg) scale(1.15)',opacity:0}],{duration:420,easing:'ease-out',fill:'forwards'});
  for(var i=0;i<6;i++){var b=ex('bolt',mx,my);b.animate([{transform:'rotate('+(i*60+15)+'deg) scaleY(.1)',opacity:1},{transform:'rotate('+(i*60+15)+'deg) scaleY(1)',opacity:0}],{duration:420,easing:'ease-out',fill:'forwards'});}
  starBurst(mx,my);
  hero.animate([{transform:T(cx,cy,3.6,-360)},{transform:T(cx,cy,4.4,-300),offset:.3},{transform:T(cx,cy,3.8,-360)}],{duration:420,fill:'forwards'});
  /* the old problem is smashed away, the new one slams in */
  var st=$('stage'),dg=document.querySelector('.dialog');
  st.animate([{transform:'none',opacity:1},{transform:'scale(1.25)',opacity:0,filter:'blur(5px)'}],{duration:260,easing:'ease-in',fill:'forwards'});
  dg.animate([{opacity:1},{opacity:0}],{duration:260,fill:'forwards'});
  ar.animate([{transform:'translate(0,0)'},{transform:'translate(-5px,3px)'},{transform:'translate(5px,-3px)'},{transform:'translate(-3px,2px)'},{transform:'none'}],{duration:300});
  buzz();S.hit();
  setTimeout(function(){
   newProblem();
   run.style.visibility='hidden';
   st.getAnimations().forEach(function(a){a.cancel();});dg.getAnimations().forEach(function(a){a.cancel();});
   st.animate([{transform:'scale(.6)',opacity:0},{transform:'scale(1.06)',opacity:1,offset:.7},{transform:'none',opacity:1}],{duration:380,easing:'ease-out'});
   dg.animate([{opacity:0,transform:'translateY(-8px)'},{opacity:1,transform:'none'}],{duration:320});
  },300);
  /* 3. teleport back to the start */
  setTimeout(function(){
   S.tele();
   var back=hero.animate([
    {transform:T(cx,cy,3.8,-360),opacity:1},
    {transform:T(cx,cy,3.8,-360+0),opacity:1,offset:.1},
    {transform:T(cx,cy,.2,-1080),opacity:0}
   ],{duration:380,easing:'ease-in',fill:'forwards'});
   var o=ex('shock',cx+15,cy+19);o.style.borderColor='#7CFF3A';o.animate([{transform:'scale(5)',opacity:1},{transform:'scale(.2)',opacity:0}],{duration:380,fill:'forwards'});
   back.onfinish=function(){
    hero.remove();
    var x0=runnerX(0);
    run.style.visibility='';
    setMove('m-spawn');fx('ring',x0+15,24);sparks(x0+15,26,10);
    var r2=ex('shock',sx+15,sy+19);r2.style.borderColor='#00e5ff';r2.animate([{transform:'scale(.2)',opacity:1},{transform:'scale(4)',opacity:0}],{duration:400,fill:'forwards'});
    document.querySelectorAll('.hx').forEach(function(e){setTimeout(function(){e.remove();},700);});
    busy=false;
   };
  },560);
 };
}

function buzz(){try{if(navigator.vibrate)navigator.vibrate(8);}catch(e){}}
function next(){
 if(busy)return;
 $('arena').classList.add('touched');buzz();
 if(cur.k<cur.last){
  var old=cur.k,a=cur.P.steps[old];
  if(!cur.t0)cur.t0=Date.now();taStart();
  if(a.pk!=null&&!cur.tried[old]){cur.tried[old]=true;cur.clean=false;}   /* skipped the prediction: no combo, no penalty */
  cur.k++;if(cur.k===cur.last)calcStars();draw();ninjaGo(cur.k,old);bumpPower();
  if(cur.k<cur.last)S.tap(cur.k/cur.last);
  if(cur.k===cur.last)award();
 }else transitionNext();
}
function back(){
 if(busy)return;
 $('arena').classList.add('touched');
 if(cur.k>0){var old=cur.k;cur.k--;buzz();S.back();draw();ninjaGo(cur.k,old);bumpPower();}
}
function pickChoice(v){
 if(busy||cur.k>=cur.last)return;
 var k=cur.k,q=cur.P.steps[k].pk;
 if(v===q){
  S.good();
  if(!cur.tried[k]){combo++;comboUI(true);var e=document.createElement('div');e.className='xpfloat';e.textContent=combo>1?'🔥 ×'+combo:'✓ NICE!';e.style.top='120px';$('arena').appendChild(e);setTimeout(function(){e.remove();},1450);}
  cur.tried[k]=true;next();
 }else{
  S.bad();cur.tried[k]=true;cur.clean=false;combo=0;comboUI(false);bumpPower();
  (cur.wrong[k]=cur.wrong[k]||[]).push(v);
  var bs=document.querySelectorAll('.pk');for(var i=0;i<bs.length;i++)if(Number(bs[i].getAttribute('data-v'))===v){bs[i].classList.add('bad');bs[i].disabled=true;}
 }
}
$('pick').addEventListener('click',function(e){var b=e.target.closest('.pk');if(b&&!b.disabled)pickChoice(Number(b.getAttribute('data-v')));});
$('zr').addEventListener('click',next);
$('zl').addEventListener('click',back);
document.addEventListener('keydown',function(e){
 if(e.key==='ArrowRight'){e.preventDefault();next();}
 else if(e.key==='ArrowLeft'){e.preventDefault();back();}
});
document.addEventListener('pointerdown',function(){if(save.sound)au();},{once:true});
$('nj').addEventListener('animationend',function(){var nj=$('nj'),c=nj.getAttribute('class')||'';if(c.indexOf('m-')>-1)nj.setAttribute('class','nj');});
$('newBtn').addEventListener('click',function(){if(!busy)newProblem();});
$('lvlBtn').addEventListener('click',function(){
 var row=$('lvlRow'),open=row.hidden;row.hidden=!open;$('lvlBtn').setAttribute('aria-expanded',open?'true':'false');
 if(cur){cur.dh=null;draw();}
});
document.querySelectorAll('.lv[data-level]').forEach(function(b){b.addEventListener('click',function(){
 if(busy)return;
 level=b.getAttribute('data-level');
 document.querySelectorAll('.lv[data-level]').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false');});
 $('lvlRow').hidden=true;$('lvlBtn').setAttribute('aria-expanded','false');
 newProblem();
});});
$('fontBtn').addEventListener('click',function(){
 var idx=0;FONTS.forEach(function(f,i){if(f[0]===save.font)idx=i;});
 save.font=FONTS[(idx+1)%FONTS.length][0];persist();applyFont();cur.dh=null;draw();
});
$('skinBtn').addEventListener('click',function(){
 var r=rankOf(save.xp);
 if(r===0){toast('🔒 Rank up to unlock new ninja skins! (100 XP = Builder)');return;}
 save.skin=(save.skin+1)%(r+1);persist();applySkin();S.good();
});
$('soundBtn').addEventListener('click',function(){save.sound=!save.sound;persist();applyToggles();if(save.sound)S.good();});
$('predBtn').addEventListener('click',function(){
 save.predict=!save.predict;persist();applyToggles();
 if(cur){cur.dh=null;draw();}
});
$('guideBtn').addEventListener('click',function(){save.guide=!save.guide;persist();applyToggles();if(cur){cur.dh=null;draw();}});
$('methBtn').addEventListener('click',function(){if(busy)return;save.method={mix:'paper',paper:'box',box:'mix'}[save.method]||'mix';persist();applyToggles();newProblem();});
$('taBtn').addEventListener('click',function(){if(busy)return;save.ta=!save.ta;persist();taReset();applyToggles();});
$('quest').addEventListener('click',openChest);
window.addEventListener('resize',function(){if(cur){cur.dh=null;draw();}});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){if(cur){cur.dh=null;draw();}});
window.__ld={makeProblem:makeProblem,nearMiss:nearMiss,get:function(){return {cur:cur,combo:combo,save:save};},pick:pickChoice,next:next};
applyFont();applySkin();applyToggles();taDraw(60);
newProblem();
})();
</script>

<style id="g5-fit">
html.g5-fit .app{max-width:var(--g5-w,520px);zoom:var(--g5-z,1)}
.g5-switch{position:fixed;left:max(8px,env(safe-area-inset-left));bottom:max(8px,env(safe-area-inset-bottom));z-index:50;display:flex;gap:6px;font:700 12px/1 'Rubik',system-ui,sans-serif}

<script>
(function () {
  /* Big screens: scale the whole arena up to fit the screen height, and let the panel use the width. */
  var app = document.querySelector('.app');
  if (!app) return;
  var root = document.documentElement;
  function fit() {
    var vw = window.innerWidth, vh = window.innerHeight;
    root.classList.remove('g5-fit');
    root.style.removeProperty('--g5-z'); root.style.removeProperty('--g5-w');
    if (vw < 900) return;
    var h = app.scrollHeight || 600;
    var z = Math.max(1, Math.min((vh - 40) / h, 2.4));
    var w = Math.min((vw * 0.94) / z, 520 * 2.1);
    root.style.setProperty('--g5-z', z.toFixed(3));
    root.style.setProperty('--g5-w', Math.max(520, Math.round(w)) + 'px');
    root.classList.add('g5-fit');
    /* A wider panel can be shorter: re-check the height once more. */
    var h2 = app.scrollHeight;
    if (h2 && h2 * z > vh - 34) root.style.setProperty('--g5-z', Math.max(1, (vh - 34) / h2).toFixed(3));
  }
  /* When a new problem changes the arena's height, re-fit the scale (width stays put). */
  function refit() {
    if (!root.classList.contains('g5-fit')) return;
    var h = app.scrollHeight; if (!h) return;
    var z = Math.max(1, Math.min((window.innerHeight - 40) / h, 2.4));
    z = Math.floor(z * 50) / 50;
    if (Math.abs(z - parseFloat(root.style.getPropertyValue('--g5-z') || '1')) >= 0.02) root.style.setProperty('--g5-z', z.toFixed(2));
  }
  if (window.ResizeObserver) { var rt; new ResizeObserver(function () { cancelAnimationFrame(rt); rt = requestAnimationFrame(refit); }).observe(app); }
  var t; window.addEventListener('resize', function () { clearTimeout(t); t = setTimeout(fit, 120); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  window.addEventListener('load', fit);
  fit();
})();
</script>
