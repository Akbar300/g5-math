<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="../favicon.svg">
  <title>Multiply Arena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=IBM+Plex+Mono:wght@600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/app.css">
  <script src="../js/theme.js"></script>
</head>
<body>
  <div id="app" class="app-shell arena-shell"></div>
  <script src="../js/visuals.js"></script>
  <script src="../js/engine.js"></script>
  <script>
  (function () {
    const root = document.getElementById('app');
    const LEVELS = [
      { id: 'facts', name: 'Facts', hint: 'Times-table facts through 12 × 12. No paper needed.' },
      { id: 'mental', name: 'Mental tricks', hint: '×5, ×9, ×11, ×25, double-halve, 5-square, and round-and-fix.' },
      { id: '2x1', name: '2-digit × 1-digit', hint: 'One partial-product row on the paper grid.' },
      { id: '2x2', name: '2-digit × 2-digit', hint: 'Partial products on the paper grid.' },
      { id: '3x2', name: '3-digit × 2-digit', hint: 'Watch the place-value zeros on each row.' },
      { id: '3x3', name: '3-digit × 3-digit', hint: 'Three partial-product rows, then add.' }
    ];
    let lvl = '2x2', n = 0, right = 0;

    function facts() {
      const a = U.ri(2, 12), b = U.ri(2, 12);
      return { type: 'num', fmt: 'FACT', q: 'What is <b>' + a + ' × ' + b + '</b>?', a: a * b, why: a + ' × ' + b + ' = <b>' + (a * b) + '</b>.' };
    }

    function mental() {
      const k = U.pick(['ten', 'hundred', 'double', 'x25', 'x5', 'x9', 'x11', 'half', 'fix', 'sq5']);
      if (k === 'ten') {
        const a = U.ri(12, 99);
        return { type: 'num', fmt: 'MENTAL', q: 'What is <b>' + a + ' × 10</b>?', a: a * 10, why: '× 10 moves every digit one place left: <b>' + (a * 10) + '</b>.' };
      }
      if (k === 'hundred') {
        const a = U.ri(12, 99);
        return { type: 'num', fmt: 'MENTAL', q: 'What is <b>' + a + ' × 100</b>?', a: a * 100, why: '× 100 moves every digit two places left: <b>' + (a * 100) + '</b>.' };
      }
      if (k === 'double') {
        const a = U.ri(15, 48);
        return { type: 'num', fmt: 'MENTAL', q: 'What is <b>' + a + ' × 2</b>?', a: a * 2, why: 'Double ' + a + ' is <b>' + (a * 2) + '</b>.' };
      }
      if (k === 'x25') {
        const a = U.ri(4, 24);
        return { type: 'num', fmt: 'MENTAL', q: 'What is <b>' + a + ' × 25</b>?', a: a * 25, why: a + ' × 25 = ' + a + ' × 100 ÷ 4 = <b>' + (a * 25) + '</b>.' };
      }
      if (k === 'x5') {
        const a = U.ri(12, 98);
        return { type: 'num', fmt: 'MENTAL', q: 'What is <b>' + a + ' × 5</b>?', a: a * 5, why: '× 5 is half of × 10: ' + a + ' × 10 = ' + (a * 10) + ', then half is <b>' + (a * 5) + '</b>.' };
      }
      if (k === 'x9') {
        const a = U.ri(12, 48);
        return { type: 'num', fmt: 'MENTAL', q: 'What is <b>' + a + ' × 9</b>?', a: a * 9, why: '× 9 is × 10 minus the number: ' + (a * 10) + ' − ' + a + ' = <b>' + (a * 9) + '</b>.' };
      }
      if (k === 'x11') {
        const a = U.ri(11, 99);
        return { type: 'num', fmt: 'MENTAL', q: 'What is <b>' + a + ' × 11</b>?', a: a * 11, why: 'For a two-digit number, × 11 is the first digit, the two digits added (carry if needed), then the last digit: <b>' + (a * 11) + '</b>.' };
      }
      if (k === 'half') {
        const a = U.ri(8, 48) * 2;
        const b = U.ri(6, 24);
        return { type: 'num', fmt: 'MENTAL', q: 'What is <b>' + a + ' × ' + b + '</b>?', a: a * b, why: 'Double-halve: half of ' + a + ' is ' + (a / 2) + ', double ' + b + ' is ' + (b * 2) + '. ' + (a / 2) + ' × ' + (b * 2) + ' = <b>' + (a * b) + '</b>.' };
      }
      if (k === 'fix') {
        const ones = U.pick([1, 2, 8, 9]);
        const a = U.ri(2, 8) * 10 + ones;
        const b = U.ri(4, 12);
        const near = ones <= 2 ? a - ones : a + (10 - ones);
        const diff = a - near;
        const adj = Math.abs(diff) * b;
        const verb = diff < 0 ? 'subtract' : 'add';
        return { type: 'num', fmt: 'MENTAL', q: 'What is <b>' + a + ' × ' + b + '</b>?', a: a * b, why: a + ' is ' + near + (diff < 0 ? ' minus ' : ' plus ') + Math.abs(diff) + '. ' + near + ' × ' + b + ' = ' + (near * b) + ', then ' + verb + ' ' + adj + ': <b>' + (a * b) + '</b>.' };
      }
      const tens = U.ri(1, 9);
      const a = tens * 10 + 5;
      return { type: 'num', fmt: 'MENTAL', q: 'What is <b>' + a + ' × ' + a + '</b>?', a: a * a, why: 'A number ending in 5 squared: take the tens digit ' + tens + ', multiply by one more (' + tens + ' × ' + (tens + 1) + ' = ' + (tens * (tens + 1)) + '), then write 25: <b>' + (a * a) + '</b>.' };
    }

    function paper() {
      let a, b;
      if (lvl === '2x1') { a = U.ri(12, 98); b = U.ri(3, 9); }
      else if (lvl === '2x2') { a = U.ri(12, 98); b = U.ri(12, 98); }
      else if (lvl === '3x2') { a = U.ri(108, 986); b = U.ri(12, 48); }
      else { a = U.ri(108, 876); b = U.ri(108, 432); }
      return { type: 'paper-mul', fmt: 'PAPER', q: 'Multiply <b>' + a + ' × ' + b + '</b>. Use the paper grid — carries and partial products.', a: a, b: b, why: a + ' × ' + b + ' = <b>' + (a * b) + '</b>.' };
    }

    function item() {
      if (lvl === 'facts') return facts();
      if (lvl === 'mental') return mental();
      return paper();
    }

    function paint() {
      root.innerHTML = `
        <div class="app-bar">
          <a class="back" href="../index.html">← Lab</a><a class="back" href="multiply.html" title="The original ninja arena">Original arena</a>
          <h1><span>🤖</span> Multiply Arena</h1>
          <div class="grow"></div>
          <button type="button" class="icon-btn theme-toggle" data-theme-toggle></button>
          <div class="xp">⭐ ${right} first-try of ${n}</div>
        </div>
        <div class="arena-grid">
          <aside class="stage" style="overflow:auto">
            <h2>Pick a lane</h2>
            <p class="lede">The wide side is for paper. Calm pace — no timer.</p>
            <div class="lesson-chips" id="chips"></div>
            <p class="lede" id="hint"></p>
          </aside>
          <section class="stage" id="work" style="overflow:auto"></section>
        </div>`;
      const chips = root.querySelector('#chips');
      LEVELS.forEach((L) => {
        const b = document.createElement('button');
        b.className = 'chip' + (L.id === lvl ? ' on' : '');
        b.textContent = L.name;
        b.onclick = () => { lvl = L.id; paint(); };
        chips.appendChild(b);
      });
      root.querySelector('#hint').textContent = (LEVELS.find((x) => x.id === lvl) || {}).hint || '';
      if (window.G5Theme) G5Theme.sync();
      next();
    }
    function next() {
      const host = root.querySelector('#work');
      host.innerHTML = '<h2>Your problem</h2>';
      const it = item();
      n++;
      Lab.renderItem(host, it, {
        label: 'Problem ' + n,
        nextLabel: 'Next',
        onDone: (ok) => {
          if (ok) right++;
          root.querySelector('.xp').textContent = '⭐ ' + right + ' first-try of ' + n;
        },
        onNext: next
      });
    }
    paint();
  })();
  </script>
</body>
</html>
