<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Division Arena</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=IBM+Plex+Mono:wght@600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/app.css">
  <script src="../js/theme.js"></script>
</head>
<body>
  <div id="app" class="app-shell arena-shell"></div>
  <script src="../js/visuals.js"></script>
  <script src="../js/engine.js"></script>
  <script>
  (function () {
    const root = document.getElementById('app');
    const LEVELS = [
      { id: '2x1', name: '2-digit ÷ 1', hint: 'A short tableau. Estimate the first digit, then bring the next one down.' },
      { id: '3x1', name: '3-digit ÷ 1', hint: 'Bring each digit down in turn. Watch for a 0 in the quotient.' },
      { id: '4x1', name: '4-digit ÷ 1', hint: 'Same steps, just a longer dividend. Zeros in the quotient still get a work row.' },
      { id: '3x2', name: '3-digit ÷ 2', hint: 'Think compatible numbers, then adjust the digit.' },
      { id: '4x2', name: '4-digit ÷ 2', hint: 'Estimate each digit first. Check by multiplying back.' },
      { id: 'rem', name: 'With remainders', hint: 'The remainder must be smaller than the divisor.' }
    ];
    let lvl = '3x1', n = 0, right = 0;

    function evenQ(lo, hi, b) {
      const qLo = Math.max(2, Math.ceil(lo / b));
      const qHi = Math.max(qLo, Math.floor(hi / b));
      return U.ri(qLo, qHi);
    }

    function item() {
      let b, q, r = 0;
      if (lvl === '2x1') { b = U.ri(2, 9); q = evenQ(10, 99, b); }
      else if (lvl === '3x1') { b = U.ri(2, 9); q = evenQ(100, 999, b); }
      else if (lvl === '4x1') { b = U.ri(2, 9); q = evenQ(1000, 9999, b); }
      else if (lvl === '3x2') { b = U.ri(11, 49); q = evenQ(100, 999, b); }
      else if (lvl === '4x2') { b = U.ri(11, 49); q = evenQ(1000, 9999, b); }
      else {
        b = U.ri(12, 28);
        q = U.ri(15, 76);
        r = U.ri(1, b - 1);
      }
      const a = b * q + r;
      return {
        type: 'paper-div',
        fmt: 'PAPER',
        q: 'Divide <b>' + a + ' ÷ ' + b + '</b> on the paper grid.' + (r ? ' There will be a remainder.' : ' It should come out even.'),
        a: a, b: b,
        why: a + ' ÷ ' + b + ' = <b>' + q + (r ? ' R ' + r : '') + '</b>. Check: ' + b + ' × ' + q + (r ? ' + ' + r : '') + ' = ' + a + '.'
      };
    }

    function paint() {
      root.innerHTML = `
        <div class="app-bar">
          <a class="back" href="../index.html">← Lab</a><a class="back" href="division.html" title="The original ninja arena">Original arena</a>
          <h1><span>🤖</span> Division Arena</h1>
          <div class="grow"></div>
          <button type="button" class="icon-btn theme-toggle" data-theme-toggle></button>
          <div class="xp">⭐ ${right} first-try of ${n}</div>
        </div>
        <div class="arena-grid">
          <aside class="stage" style="overflow:auto">
            <h2>Pick a lane</h2>
            <p class="lede">Long division uses the full width. One problem at a time — no rush.</p>
            <div class="lesson-chips" id="chips"></div>
            <p class="lede" id="hint"></p>
          </aside>
          <section class="stage" id="work" style="overflow:auto"></section>
        </div>`;
      const chips = root.querySelector('#chips');
      LEVELS.forEach((L) => {
        const b = document.createElement('button');
        b.className = 'chip' + (L.id === lvl ? ' on' : '');
        b.textContent = L.name;
        b.onclick = () => { lvl = L.id; paint(); };
        chips.appendChild(b);
      });
      root.querySelector('#hint').textContent = (LEVELS.find((x) => x.id === lvl) || {}).hint || '';
      if (window.G5Theme) G5Theme.sync();
      next();
    }
    function next() {
      const host = root.querySelector('#work');
      host.innerHTML = '<h2>Your problem</h2>';
      n++;
      Lab.renderItem(host, item(), {
        label: 'Problem ' + n,
        nextLabel: 'Next',
        onDone: (ok) => {
          if (ok) right++;
          root.querySelector('.xp').textContent = '⭐ ' + right + ' first-try of ' + n;
        },
        onNext: next
      });
    }
    paint();
  })();
  </script>
</body>
</html>
